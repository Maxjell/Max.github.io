<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="client.css">
</head>
<body>
    <div class="Art">
      <h1>Great Artists</h1>
      <div class="main-test">
        <figure>
            <img src="Leonardo.jpg" alt="Leonardo">
            <figcaption>
              <p><q>Learning never exhausts the mind.</q></p>
              <p>- Leonardo</p>
            </figcaption>
        </figure>
        <figure>
          <img src="Michelangelo.jpg" alt="Michelangelo">
          <figcaption>
            <p><q>I saw the angel in <br> the marble and carved <br> until I set him <br> free.</q></p>
            <p>- Michelangelo</p> 
          </figcaption>
        </figure>
        <figure>
          <img src="Raphael.jpg" alt="Raphael">
          <figcaption>
            <p><q>When one is painting one does not think.</q></p>
            <p>- Raphael</p> 
          </figcaption>
        </figure>
      </div>   
    </div>
</body>
</html>
